<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAPT Session Proxy</title>
  <style>
    :root {
      --accent: #466557;
      --accent-hover: #385246;
      --accent-soft: rgba(70, 101, 87, 0.11);
      --accent-border: rgba(70, 101, 87, 0.32);
      --bg: #f6f8f7;
      --surface: #ffffff;
      --border: #dfe5e2;
      --text: #18201c;
      --text-muted: #5d6c65;
      --danger: #a63a3a;
      --danger-soft: rgba(166, 58, 58, 0.09);
      --danger-border: rgba(166, 58, 58, 0.28);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 390px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
      line-height: 1.4;
      padding: 12px;
    }

    .app {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .brand-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .status-pill {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .status-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Target tab + Primary button */
    .tab-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .tab-meta-url {
      font-family: var(--mono);
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 245px;
    }

    .btn-primary {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-primary.attached {
      background: var(--surface);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .btn-primary.attached:hover:not(:disabled) {
      background: var(--danger-soft);
      border-color: var(--danger);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-banner {
      font-size: 11px;
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      padding: 6px 8px;
    }

    .hidden {
      display: none !important;
    }

    /* Controls grid */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
    }

    .muted-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg);
    }

    .segmented button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 9px;
      cursor: pointer;
    }

    .segmented button + button {
      border-left: 1px solid var(--border);
    }

    .segmented button.selected {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    select,
    input[type="text"],
    textarea {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    select:focus,
    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
      background: var(--surface);
    }

    select {
      font-family: var(--sans);
      padding: 4px 6px;
    }

    .filter-input {
      flex: 1;
      min-width: 0;
    }

    /* Toggle switch */
    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .switch {
      position: relative;
      width: 32px;
      height: 18px;
      display: inline-block;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #cbd4cf;
      border-radius: 999px;
      transition: background 0.15s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.15s ease;
    }

    .switch input:checked + .slider {
      background: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(14px);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-row input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Tokens */
    .token-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .token-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .token-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .type-badge {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .type-badge.detected {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent-border);
    }

    .token-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .link-btn {
      border: none;
      background: none;
      color: var(--accent);
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    textarea {
      width: 100%;
      resize: vertical;
      min-height: 44px;
      max-height: 90px;
      line-height: 1.35;
      word-break: break-all;
    }

    /* Traffic Log */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .log-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-empty {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      padding: 10px 4px;
      background: var(--bg);
      border-radius: 6px;
      border: 1px dashed var(--border);
    }

    .log-item {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10px;
    }

    .log-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .log-tag.swapped {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .log-method {
      font-weight: 700;
      color: var(--text);
    }

    .log-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-muted);
    }

    .log-status {
      font-weight: 600;
      color: var(--text-muted);
    }

    .log-status.ok {
      color: var(--accent);
    }

    .log-status.blocked {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">VAPT Session Proxy</div>
          <div class="brand-sub">CDP 1.3 · BOLA / PrivEsc</div>
        </div>
      </div>
      <span id="statusBadge" class="status-pill">IDLE</span>
    </header>

    <section class="card">
      <div class="tab-meta">
        <span id="targetTabLabel">Target Tab: —</span>
        <span id="targetTabUrl" class="tab-meta-url">—</span>
      </div>
      <button id="toggleProxyBtn" class="btn-primary" type="button">
        Enable Interception Proxy
      </button>
      <div id="errorBanner" class="error-banner hidden" role="alert"></div>
    </section>

    <section class="card">
      <div class="control-row">
        <span class="field-label">Auto-Capture</span>
        <div id="captureTargetGroup" class="segmented" role="group" aria-label="Auto-Capture Target">
          <button type="button" data-target="off">Off</button>
          <button type="button" data-target="userA" class="selected">User A</button>
          <button type="button" data-target="userB">User B</button>
        </div>
      </div>

      <div class="control-row">
        <label class="field-label" for="headerMode">Header</label>
        <select id="headerMode">
          <option value="auto">Auto (Auth / Cookie)</option>
          <option value="Authorization">Authorization</option>
          <option value="Cookie">Cookie</option>
        </select>

        <label class="switch-label" for="swapEnabled" title="Hot-swap User A credentials with User B on matching API requests">
          <span class="field-label">Hot-Swap A→B</span>
          <span class="switch">
            <input id="swapEnabled" type="checkbox" checked />
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <div class="control-row">
        <label class="muted-label" for="urlFilter">Match</label>
        <input id="urlFilter" class="filter-input" type="text" value="/api/" placeholder="/api/, /graphql or *" spellcheck="false" />
      </div>

      <label class="checkbox-row" for="stripBothAuthHeaders">
        <input id="stripBothAuthHeaders" type="checkbox" />
        <span>Strip both Authorization &amp; Cookie before injecting User B</span>
      </label>
    </section>

    <section class="card">
      <div class="token-group">
        <div class="token-header">
          <div class="token-title-wrap">
            <label class="field-label" for="userAToken">User A Token</label>
            <span id="userABadge" class="type-badge">Empty</span>
          </div>
          <div class="token-actions">
            <button id="clearUserABtn" class="link-btn" type="button">Clear</button>
          </div>
        </div>
        <textarea
          id="userAToken"
          rows="2"
          placeholder="Auto-captured or paste User A Authorization / Cookie..."
          spellcheck="false"
        ></textarea>
      </div>

      <div class="token-group">
        <div class="token-header">
          <div class="token-title-wrap">
            <label class="field-label" for="userBToken">User B Token</label>
            <span id="userBBadge" class="type-badge">Empty</span>
          </div>
          <div class="token-actions">
            <button id="swapTokensBtn" class="link-btn" type="button">Swap A↔B</button>
            <button id="clearUserBBtn" class="link-btn" type="button">Clear</button>
          </div>
        </div>
        <textarea
          id="userBToken"
          rows="2"
          placeholder="Auto-captured or paste User B Authorization / Cookie..."
          spellcheck="false"
        ></textarea>
      </div>
    </section>

    <section class="card">
      <div class="log-header">
        <span class="field-label">Intercepted API Traffic</span>
        <button id="clearLogsBtn" class="link-btn" type="button">Clear</button>
      </div>
      <ul id="trafficLog" class="log-list">
        <li class="log-empty">Enable proxy and trigger /api/ traffic to inspect swaps.</li>
      </ul>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
